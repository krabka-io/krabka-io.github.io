<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-grad" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="60%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Lines -->
  <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300 M 0 400 L 1200 400 M 0 500 L 1200 500" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 200 0 L 200 630 M 400 0 L 400 630 M 600 0 L 600 630 M 800 0 L 800 630 M 1000 0 L 1000 630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Logo Group -->
  <g transform="translate(80, 80)">
    <g transform="scale(1.3)">
      <ellipse style="fill:none;stroke:#FF4D2E;stroke-width:7.6591;" cx="45" cy="45" rx="13.749" ry="8.691"/>
      <g>
        <circle style="fill:none;stroke:#FF4D2E;stroke-width:5.011;" cx="31.5" cy="21.7" r="7.15"/>
        <path style="fill:none;stroke:#FF4D2E;stroke-width:5.011;" d="m -37.43,-19.05 a 7.15,7.15 0 0 1 -4.41,6.6 7.15,7.15 0 0 1 -7.79,-1.55 7.15,7.15 0 0 1 -1.55,-7.79 7.15,7.15 0 0 1 6.6,-4.41" transform="rotate(-135)"/>
        <rect style="fill:#FF4D2E;stroke:none;" width="4.5" height="12.7" x="14.2" y="41.1" transform="rotate(-30)"/>
      </g>
      <g transform="matrix(-1,0,0,1,90,0)">
        <circle style="fill:none;stroke:#FF4D2E;stroke-width:5.011;" cx="31.5" cy="21.7" r="7.15"/>
        <path style="fill:none;stroke:#FF4D2E;stroke-width:5.011;" d="m -37.43,-19.05 a 7.15,7.15 0 0 1 -4.41,6.6 7.15,7.15 0 0 1 -7.79,-1.55 7.15,7.15 0 0 1 -1.55,-7.79 7.15,7.15 0 0 1 6.6,-4.41" transform="rotate(-135)"/>
        <rect style="fill:#FF4D2E;stroke:none;" width="4.5" height="12.7" x="14.2" y="41.1" transform="rotate(-30)"/>
      </g>
    </g>
    <text x="135" y="80" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">Krabka</text>
  </g>

  <!-- Tagline / Title -->
  <text x="80" y="270" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.03em">
    Kafka without the JVM.
  </text>
  <text x="80" y="340" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#FF4D2E" letter-spacing="-0.03em">
    Extreme efficiency in Rust.
  </text>

  <!-- Subtitle -->
  <text x="80" y="420" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" letter-spacing="-0.01em">
    Byte-exact wire-protocol parity, native KRaft consensus, tiered storage, and Apache Arrow streams.
  </text>

  <!-- Metric Badges -->
  <g transform="translate(80, 480)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="70" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-transform="uppercase">Memory Working Set</text>
    <text x="24" y="56" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">114 MiB RSS</text>

    <!-- Badge 2 -->
    <rect x="240" y="0" width="220" height="70" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="264" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-transform="uppercase">Cold Start to Ready</text>
    <text x="264" y="56" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#4ade80">1.2 Seconds</text>

    <!-- Badge 3 -->
    <rect x="480" y="0" width="240" height="70" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="504" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-transform="uppercase">Wire Protocol</text>
    <text x="504" y="56" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#fb923c">Apache Kafka 4.3</text>
  </g>

  <!-- URL watermark -->
  <text x="1120" y="580" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#64748b">krabka.io</text>
</svg>
