<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-grad" cx="80%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#14223d"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top-left Brand Logo -->
  <g transform="translate(80, 60)">
    <!-- Vector Crab Logo -->
    <svg width="60" height="60" viewBox="0 0 90 90" fill="none">
      <g transform="matrix(1.2410837,0,0,1.2410837,-10.847205,1.7895666)">
        <ellipse style="fill:none;stroke:#FF4D2E;stroke-width:7.6591;" cx="45" cy="45" rx="13.749256" ry="8.6910944"/>
        <g>
          <circle style="fill:none;stroke:#FF4D2E;stroke-width:5.01105;" cx="31.509378" cy="21.770279" r="7.1520071"/>
          <path style="fill:none;stroke:#FF4D2E;stroke-width:5.01105;" d="m -37.432668,-19.054935 a 7.1520071,7.1520071 0 0 1 -4.415052,6.607593 7.1520071,7.1520071 0 0 1 -7.794188,-1.550361 7.1520071,7.1520071 0 0 1 -1.55036,-7.794187 7.1520071,7.1520071 0 0 1 6.607593,-4.415053" transform="rotate(-135)"/>
          <rect style="fill:#FF4D2E;stroke:none;" width="4.4989443" height="12.777002" x="14.19296" y="41.136307" transform="rotate(-30)"/>
        </g>
        <g transform="matrix(-1,0,0,1,89.997483,0)">
          <circle style="fill:none;stroke:#FF4D2E;stroke-width:5.01105;" cx="31.509378" cy="21.770279" r="7.1520071"/>
          <path style="fill:none;stroke:#FF4D2E;stroke-width:5.01105;" d="m -37.432668,-19.054935 a 7.1520071,7.1520071 0 0 1 -4.415052,6.607593 7.1520071,7.1520071 0 0 1 -7.794188,-1.550361 7.1520071,7.1520071 0 0 1 -1.55036,-7.794187 7.1520071,7.1520071 0 0 1 6.607593,-4.415053" transform="rotate(-135)"/>
          <rect style="fill:#FF4D2E;stroke:none;" width="4.4989443" height="12.777002" x="14.19296" y="41.136307" transform="rotate(-30)"/>
        </g>
      </g>
    </svg>
    <text x="75" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Krabka</text>
  </g>

  <!-- Headline -->
  <text x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Kafka without the JVM.</text>
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#FF4D2E" letter-spacing="-0.02em">Extreme efficiency in Rust.</text>

  <!-- Subtitle -->
  <text x="80" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#94a3b8" letter-spacing="-0.01em">
    Byte-exact Kafka wire protocol • Native KRaft quorum • S3 tiered storage • Polyglot Arrow streams
  </text>

  <!-- Metric Badges Grid -->
  <g transform="translate(80, 420)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="90" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="22" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">MEMORY WORKING SET</text>
    <text x="22" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="24" font-weight="800" fill="#38bdf8">114 MiB RSS</text>

    <!-- Badge 2 -->
    <rect x="245" y="0" width="220" height="90" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="267" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">COLD START TO READY</text>
    <text x="267" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="24" font-weight="800" fill="#4ade80">1.2 Seconds</text>

    <!-- Badge 3 -->
    <rect x="490" y="0" width="230" height="90" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="512" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">WIRE PROTOCOL</text>
    <text x="512" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="24" font-weight="800" fill="#fb923c">Apache Kafka 4.3</text>
  </g>

  <!-- URL Watermark -->
  <text x="1120" y="555" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#475569" letter-spacing="0.02em">krabka.io</text>
</svg>
