name: krabka-quickstart

services:
  # Krabka standalone KRaft controller & broker node
  broker:
    image: ghcr.io/krabka-io/crabka-broker:latest
    restart: unless-stopped
    command:
      - "crabka-broker"
      - "--listen-addr=0.0.0.0:9092"
      - "--advertised-listener=localhost:9092"
      - "--log-dir=/data"
      - "--process-roles=controller,broker"
    environment:
      RUST_LOG: "info"
      CRABKA_METRICS_LISTEN_ADDR: "0.0.0.0:9404"
    ports:
      - "9092:9092"
      - "9404:9404"
    volumes:
      - broker-data:/data

volumes:
  broker-data:
