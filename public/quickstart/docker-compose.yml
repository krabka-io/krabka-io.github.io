name: krabka-quickstart

services:
  broker-permissions:
    image: mirror.gcr.io/library/busybox:1.38
    restart: "no"
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - broker-data:/data

  # One-shot: initialize KRaft metadata on a fresh writable volume.
  broker-format:
    image: ghcr.io/krabka-io/krabka-broker@sha256:886fbe511a0cadacec0c352fe10b295063b3807c0df133d2fce4ea804f4fffcd
    platform: linux/amd64
    restart: "no"
    entrypoint: ["/usr/bin/krabka-format"]
    command:
      - "--log-dir=/data"
      - "--cluster-id=3d70a78c-bb3a-4af5-a767-51e31f403c62"
      - "--standalone"
      - "--node-id=1"
      - "--controller-listener=localhost:9093"
      - "--ignore-formatted"
    volumes:
      - broker-data:/data
    depends_on:
      broker-permissions:
        condition: service_completed_successfully

  # Krabka standalone KRaft controller & broker node
  broker:
    image: ghcr.io/krabka-io/krabka-broker@sha256:886fbe511a0cadacec0c352fe10b295063b3807c0df133d2fce4ea804f4fffcd
    platform: linux/amd64
    restart: unless-stopped
    command:
      - "--listen-addr=0.0.0.0:9092"
      - "--advertised-listener=localhost:9092"
      - "--log-dir=/data"
      - "--process-roles=controller,broker"
    environment:
      RUST_LOG: "info"
      KRABKA_METRICS_LISTEN_ADDR: "0.0.0.0:9404"
    ports:
      - "9092:9092"
      - "9404:9404"
    volumes:
      - broker-data:/data
    depends_on:
      broker-format:
        condition: service_completed_successfully

volumes:
  broker-data:
