                type: object
              runtime:
                description: Optional worker runtime overrides.
                nullable: true
                properties:
                  commitIntervalMs:
                    description: Maximum interval between durable checkpoint commits, in milliseconds.
                    format: uint64
                    minimum: 1.0
                    nullable: true
                    type: integer
