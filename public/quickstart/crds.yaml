                additionalProperties:
                  type: string
                description: "Opaque broker properties, in `server.properties`-style key and value\npairs. The operator passes them through to the broker's\n`[server_properties]` TOML table, and the broker treats them as inert\ntoday. Changes propagate through the config hash."
                nullable: true
                type: object
              delegationToken:
                description: "Delegation-token master HMAC key source. When `None`, the broker\nrejects all KIP-48 delegation-token RPCs with err 61\n`DELEGATION_TOKEN_AUTH_DISABLED`. When `Some`, the operator injects\n`KRABKA_DELEGATION_TOKEN_SECRET_KEY` into each broker pod through a\n`valueFrom.secretKeyRef`. The key is then part of the rendered\n`StatefulSet`, so the SSA reconcile does not race with out-of-band\n`kubectl set env` patches."
                nullable: true
                properties:
                  secretKeyRef:
                    description: "Reference to a Kubernetes `Secret` in the same namespace as the\n`Kafka` CR. Its `data.<key>` value is the broker's master HMAC key for\nKIP-48 delegation tokens."
                    properties:
                      key:
                        description: Key within the Secret's `data`. Defaults to `secret-key`.
                        nullable: true
                        type: string
                      name:
                        description: Secret name in the same namespace as the `Kafka` CR.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretKeyRef
                type: object
              interBrokerKerberos:
                description: "Inter-broker Kerberos initiate config. It is required when\n`interBrokerListenerName` resolves to a `type: gssapi` listener. It\nsupplies the shared client principal and the KDC. The keytab comes from\nthat listener's `keytabSecretRef`."
