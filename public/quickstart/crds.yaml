apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkagrpcgateways.krabka.io
spec:
  group: krabka.io
  names:
    kind: KafkaGrpcGateway
    plural: kafkagrpcgateways
    shortNames:
    - kgg
    singular: kafkagrpcgateway
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KafkaGrpcGatewaySpec via `CustomResource`
        properties:
          spec:
            properties:
              allowedTargets:
                description: "Explicit SSRF allowlist for outbound HTTP targets. The controller\nderives the entries from the `targetUrl` of each subscription. Use\nthis field to add more allowed hosts."
                items:
                  description: "One entry in the SSRF allowlist of the gateway.\n\nThe gateway permits an outbound HTTP request only when `scheme` and\n`host` match."
                  properties:
                    host:
                      description: Hostname of the allowed target, with an optional port.
                      type: string
                    scheme:
                      description: URL scheme. One of `http` or `https`.
                      type: string
                  required:
                  - host
                  - scheme
                  type: object
                type: array
              authz:
                description: "Authorization configuration. When absent, the gateway uses simple\nACL-based authorization, which is mode `simple`."
                nullable: true
                properties:
                  aclRefresh:
                    description: "How often the gateway refreshes its ACL cache from the broker,\nas a unit-carrying duration. Default `60s`."
                    nullable: true
                    type: string
                  bearer:
                    description: "Bearer-token authentication configuration. When absent,\nbearer auth is disabled."
                    nullable: true
                    properties:
                      allowableClockSkew:
                        description: "Allowable clock skew for bearer-token timestamps, as a\nunit-carrying duration such as `30s` or `500ms`."
                        nullable: true
                        type: string
                      mode:
                        description: Bearer auth mode. One of `off` or `unsecured`. Default `off`.
                        nullable: true
                        type: string
                      principalClaim:
                        description: JWT claim used as the Kafka principal. Default `sub`.
                        nullable: true
                        type: string
                    type: object
                  mode:
                    description: "Authorization mode. One of `off` or `simple`. Default `simple`,\nwhich is ACL-based and reads the `KafkaUser` ACLs from the broker."
                    nullable: true
                    type: string
                  superUsers:
                    description: "Principal strings, for example `User:admin`, that bypass all ACL\nchecks."
                    items:
                      type: string
                    type: array
                type: object
              dedup:
                description: "Configuration for the deduplication topic below the idempotent\nproduce, which gives exactly-once delivery. When absent, the\ncontroller defaults apply."
                nullable: true
                properties:
                  ownershipGroup:
                    description: "Consumer group used to divide dedup ownership between replicas.\nDefaults to a value derived from the gateway name."
                    nullable: true
                    type: string
                  partitions:
                    description: Number of partitions for the dedup topic. Default 8.
                    format: uint32
                    maximum: 2147483647.0
                    minimum: 1.0
                    nullable: true
                    type: integer
                  topic:
                    description: "Kafka topic used to store dedup state. Defaults to\n`<gateway-name>-dedup` when absent."
                    nullable: true
                    type: string
                  txnIdPrefix:
                    description: "Prefix for transactional producer IDs. Defaults to the gateway\nname. The full `transactional.id` is `<prefix>-<partition>`."
                    nullable: true
                    type: string
                  window:
                    description: "Dedup window, as a unit-carrying duration such as `24h` or `30m`.\nThe gateway drops records with the same idempotency key inside this\nwindow. Default `24h`."
                    nullable: true
                    type: string
                type: object
              healthChecks:
                description: Kubernetes readiness and liveness probe timing.
                nullable: true
                properties:
                  livenessInitialDelaySeconds:
                    format: int32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  livenessPeriodSeconds:
                    format: int32
                    minimum: 1.0
                    nullable: true
                    type: integer
                  readinessInitialDelaySeconds:
                    format: int32
                    minimum: 0.0
                    nullable: true
                    type: integer
                  readinessPeriodSeconds:
                    format: int32
                    minimum: 1.0
                    nullable: true
                    type: integer
                type: object
              image:
                description: "Container image override. When absent, the operator uses its\n`--default-gateway-image` flag."
                nullable: true
                type: string
              membershipTopic:
                description: Internal membership / owner-routing topic.
                nullable: true
                type: string
              outboundSubscriptions:
                description: "Outbound webhook subscriptions. Each entry reads from\n`sourceTopics` and HTTP-POSTs records to `targetUrl`."
                items:
                  description: "One outbound webhook subscription.\n\nThe gateway reads from `sourceTopics` and sends each record to\n`targetUrl` with an HTTP POST."
                  properties:
                    baseBackoff:
                      description: "Initial backoff for exponential retry, as a unit-carrying duration.\nDefault `500ms`."
                      nullable: true
                      type: string
                    deadLetterTopic:
                      description: "Kafka topic for the records that used all their delivery attempts.\nWhen absent, the gateway logs a failed record and discards it."
                      nullable: true
                      type: string
                    decodeToJson:
                      description: Decode Schema Registry framed values to JSON before delivery.
                      nullable: true
                      type: boolean
                    filter:
                      description: "CEL expression evaluated against the record to decide whether to\ndeliver it. An absent or empty filter delivers all records."
                      nullable: true
                      type: string
                    groupId:
                      description: Consumer group override for this subscription.
                      nullable: true
                      type: string
                    headers:
                      additionalProperties:
                        type: string
                      description: Static HTTP headers appended to every delivery request.
                      type: object
                    maxAttempts:
                      description: "Maximum number of delivery attempts before moving the record to\nthe dead-letter topic. Default 5."
                      format: uint32
                      minimum: 1.0
                      nullable: true
                      type: integer
                    maxBackoff:
                      description: Maximum backoff cap, as a unit-carrying duration. Default `30s`.
                      nullable: true
                      type: string
                    name:
                      description: "Unique name for this subscription. It is the suffix of the\nconsumer group id."
                      type: string
                    requestTimeout:
                      description: HTTP request timeout, as a unit-carrying duration. Default `10s`.
                      nullable: true
                      type: string
                    signingSecretRef:
                      description: "Secret key reference for the HMAC signing secret of the outbound\nrequest. The controller resolves it at render time."
                      nullable: true
                      properties:
                        key:
                          description: Key inside the `data` map of the Secret.
                          type: string
                        name:
                          description: Name of the Kubernetes Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    sourceTopics:
                      description: Kafka topics to consume records from.
                      items:
                        type: string
                      type: array
                    targetUrl:
                      description: HTTP endpoint to POST records to.
                      type: string
                  required:
                  - name
                  - targetUrl
                  type: object
                type: array
              replicas:
                description: Number of gateway replicas. Defaults to 1 when absent.
                format: int32
                minimum: 1.0
                nullable: true
                type: integer
              resources:
                description: CPU / memory resource requests and limits for the gateway container.
