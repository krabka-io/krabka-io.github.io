              clientsCa:
                description: "Per-cluster CA that signs `KafkaUser` TLS certs. When absent, the\noperator uses a fully-defaulted `CertificateAuthority`."
                nullable: true
                properties:
                  generateCertificateAuthority:
                    default: true
                    description: "When `true`, which is the default, the operator generates and\nrenews this CA. When `false`, the cluster admin must create the CA\n`Secret` pair first, and the operator refuses to overwrite them.\nThe admin renews a BYO CA. The `CronJob` skips a BYO CA and emits\nan Event when the CA comes near its expiry."
                    type: boolean
                  renewalDays:
                    default: 30
                    description: "Window in days before `notAfter` in which the renewal `CronJob`\nreissues the leaf certs. Default 30."
                    format: uint32
                    minimum: 0.0
                    type: integer
                  validityDays:
                    default: 365
                    description: Cert validity in days. Default 365.
                    format: uint32
                    minimum: 0.0
                    type: integer
                type: object
              clusterCa:
                description: "Per-cluster CA for inter-broker mTLS and broker certs. When absent,\nthe operator uses a fully-defaulted `CertificateAuthority`, which it\ngenerates itself with 365/30 days."
                nullable: true
                properties:
                  generateCertificateAuthority:
                    default: true
                    description: "When `true`, which is the default, the operator generates and\nrenews this CA. When `false`, the cluster admin must create the CA\n`Secret` pair first, and the operator refuses to overwrite them.\nThe admin renews a BYO CA. The `CronJob` skips a BYO CA and emits\nan Event when the CA comes near its expiry."
                    type: boolean
                  renewalDays:
                    default: 30
                    description: "Window in days before `notAfter` in which the renewal `CronJob`\nreissues the leaf certs. Default 30."
                    format: uint32
                    minimum: 0.0
