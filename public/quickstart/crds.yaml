                    description: "Inline loggers, from tracing target to level. The key `root` is\ncase-insensitive and sets the global default level as a bare\nenv-filter directive. Any other key is a tracing target, that is, a\nRust module path such as `krabka_broker`. The levels are\n`trace|debug|info|warn|error|off`, and they are case-insensitive.\n`fatal` is accepted as an alias for `error`."
                    type: object
                  type:
                    default: inline
                    enum:
                    - inline
                    - external
                    type: string
                  valueFrom:
                    description: "External logging source. This field is required when\n`type: external`. The operator uses the value of the referenced\n`ConfigMap` key verbatim as the broker's `RUST_LOG` filter."
                    nullable: true
                    properties:
                      configMapKeyRef:
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - configMapKeyRef
                    type: object
                type: object
              metadataVersion:
                description: "`KRaft` metadata version, the runtime analog of\n`inter.broker.protocol.version`. When unset, it tracks the\n`major.minor` of `kafkaVersion`. When set, it pins the metadata version\nfor a two-step upgrade or an online downgrade. The operator validates\nit against `kafkaVersion`; changes on an existing cluster are finalized\nthrough `UpdateFeatures`, with safe-downgrade semantics for a lower\ntarget. Rejections surface `KafkaVersionValid=False` and leave\n`status.metadataVersion` unchanged."
                nullable: true
                type: string
              metricsConfig:
                description: "Prometheus scrape configuration. When `None`, the brokers do not bind\n`/metrics`, and the operator renders no `PodMonitor` and no\n`ServiceMonitor`. When `Some`, the broker `StatefulSet` gains a\n`metrics` container port on TCP 9404, and the operator SSA-applies the\nresources that `pod_monitor` and `service_monitor` request."
                nullable: true
                properties:
                  podMonitor:
                    nullable: true
                    properties:
                      interval:
                        nullable: true
                        type: string
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                      scrapeTimeout:
                        nullable: true
                        type: string
                    type: object
                  serviceMonitor:
                    nullable: true
                    properties:
                      interval:
                        nullable: true
                        type: string
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                      scrapeTimeout:
                        nullable: true
                        type: string
                    type: object
                  type:
                    default: prometheus
                    enum:
                    - prometheus
                    type: string
                type: object
              networkPolicy:
                description: "Opt-in `NetworkPolicy` generation. When `None`, the operator generates\nno `NetworkPolicy`. When `Some`, even `{}`, the operator renders a\ncluster-level `NetworkPolicy` that gates ingress to the broker and\ncontroller pods."
                nullable: true
                type: object
              tieredStorage:
                description: "KIP-405: cluster-wide tiered storage. When `Some`, every broker pod\nboots with the local-tier RSM enabled, with an `emptyDir` mounted at\n`/var/lib/krabka/remote`, which is the broker's\n`remote_log_storage_dir`, and with `[remote_storage]` rendered in the\nbroker TOML. The per-topic enablement does not change. It stays\n`KafkaTopic.spec.config[\"remote.storage.enable\"] = \"true\"`.\n\nWith the `emptyDir` default and `InmemoryRemoteLogMetadataManager` as\nthe only RLMM, tier data does not survive pod restarts. PVC support\npairs with the production RLMM."
                nullable: true
                properties:
                  gcs:
                    description: "GCS-backend tuning. It is required when `kind == Gcs`, and it must be\nabsent in any other case. The struct has the same shape as\n`krabka_remote_storage::GcsConfig`. The operator renders the\nnon-credential fields verbatim into the broker TOML's\n`[remote_storage.gcs]` block. S3 uses env-var credentials, but GCS does\nnot. The operator mounts an explicit service-account JSON key as a FILE\non the broker pod and gives it to the broker as `service_account_path`\nin the TOML. Unset credentials select keyless Workload Identity or\nADC."
                    nullable: true
                    properties:
                      allowHttp:
                        description: "Allow plaintext HTTP. It is off by default. Turn it on for GCS\nemulators that run without TLS. Real GCS never needs it."
                        type: boolean
                      bucket:
                        description: GCS bucket name. Required.
                        type: string
                      credentials:
                        description: "Optional explicit service-account credentials. When None, the broker\nuses Workload Identity or ADC, which is the keyless GKE path."
                        nullable: true
                        properties:
                          serviceAccountKey:
                            description: Reference to the Secret holding the service-account JSON key.
                            properties:
                              key:
                                description: Key within the Secret's `data`. Defaults to `secret-key`.
                                nullable: true
                                type: string
                              name:
                                description: Secret name in the same namespace as the `Kafka` CR.
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - serviceAccountKey
                        type: object
                      endpoint:
                        description: "Optional custom GCS API base URL, for example for emulators and\nfakes. When `None`, the broker uses the standard Google Cloud Storage\nendpoint."
                        nullable: true
                        type: string
                      multipartChunkSize:
                        description: "Override the per-part size for multipart uploads in bytes. When unset,\nthe broker uses\n`krabka_remote_storage::DEFAULT_MULTIPART_CHUNK_SIZE`, which is\n16 MiB."
                        format: uint64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      multipartThreshold:
                        description: "Override the single-PUT and multipart cutoff in bytes. When unset, the\nbroker uses `krabka_remote_storage::DEFAULT_MULTIPART_THRESHOLD`, which\nis 100 MiB. Lower it in tests to exercise the multipart path on small\nfixtures."
                        format: uint64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      prefix:
                        description: "Optional key prefix inside the bucket. It lets more than one Krabka\ncluster share a bucket without a collision."
                        nullable: true
                        type: string
                    required:
                    - bucket
                    type: object
                  metadataManager:
                    description: "KIP-405: pick the `RemoteLogMetadataManager` that the broker pods run.\nWhen the field is absent, or when it is `type: Topic`, the broker\nactivates the durable\n`krabka_remote_storage_topic::TopicBasedRemoteLogMetadataManager`\nagainst the internal `__remote_log_metadata` topic. Tier-segment\nmetadata then survives pod restarts and is consistent across the\nbrokers in the cluster. Only an explicit `type: InMemory` selects the\nin-memory fixture, which is for test and dev only."
                    nullable: true
                    properties:
                      topic:
                        description: "Topic-backed tuning. It is optional when `kind == Topic`, and the\nbroker fills the defaults for the bootstrap and topic parameters. It\nmust be absent in any other case."
                        nullable: true
                        properties:
                          bootstrap:
                            description: "`host:port` that the broker pod dials to reach its own listener, so\nthat it can publish and consume `__remote_log_metadata`. This is\nusually the pod's loopback inter-broker listener, for example\n`127.0.0.1:9094`."
                            type: string
                          eventQueueCapacity:
                            description: Capacity of the shared metadata-event delivery queue.
                            format: uint
                            minimum: 1.0
                            nullable: true
                            type: integer
                          fetchMaxBytes:
                            description: Maximum bytes returned by each per-partition metadata fetch.
                            nullable: true
                            type: string
                          fetchMaxWait:
                            description: Maximum wait for each per-partition metadata fetch.
                            nullable: true
                            type: string
                          fetchRetryBackoff:
                            description: Backoff after a failed metadata fetch.
                            nullable: true
                            type: string
                          numPartitions:
                            description: "Partition count for `__remote_log_metadata` on the first creation.\nDefaults to 50, which is the Kafka\n`remote.log.metadata.topic.num.partitions`."
                            format: int32
                            nullable: true
                            type: integer
                          replication:
                            description: "Replication factor for `__remote_log_metadata` on the first creation.\nDefaults to 3, which is the Kafka\n`remote.log.metadata.topic.replication.factor`."
                            format: int32
                            nullable: true
                            type: integer
                          snapshotInterval:
                            description: RLMM cache snapshot cadence.
                            nullable: true
                            type: string
                          topicCreateTimeout:
                            description: Timeout for provisioning each internal metadata topic.
                            nullable: true
                            type: string
                        required:
                        - bootstrap
                        type: object
                      type:
                        description: Implementation selector.
                        enum:
                        - InMemory
                        - Topic
                        type: string
                    required:
                    - type
                    type: object
                  persistence:
                    description: "KIP-405: durable storage for the local-tier directory. It is valid\nonly with `type=Local`. When it is absent, which is the default, the\noperator renders an `emptyDir` for `tier-storage`. When `Some`, the\noperator renders a `volumeClaimTemplate` of the configured size and\nclass, so tier data survives pod restarts. Together with the\ntopic-backed RLMM, this closes the \"tier data is lost on pod restart\"\ncaveat."
                    nullable: true
                    properties:
                      class:
                        description: Storage class name. `None` means the cluster default.
                        nullable: true
                        type: string
                      deleteClaim:
                        default: false
                        description: "`true` gives\n`persistentVolumeClaimRetentionPolicy.whenDeleted: Delete`. It must\nmatch the parent `KafkaNodePool.spec.storage.deleteClaim` when both\nPVCs are present, because K8s `StatefulSets` have one set-wide\nretention policy and no per-template override. The operator validates\nthis at reconcile time, and a mismatch surfaces as\n`TieredStorageInvalid`."
                        type: boolean
                      size:
                        description: "K8s `Quantity`, for example `\"50Gi\"` or `\"500Mi\"`. It must be\nnon-empty. The Kubernetes API server validates the resource-quantity\nform at SSA time."
                        type: string
                    required:
                    - size
                    type: object
                  s3:
                    description: "S3-backend tuning. It is required when `kind == S3`, and it must be\nabsent in any other case. The struct has the same shape as\n`krabka_remote_storage::S3Config`. The operator renders the\nnon-credential fields verbatim into the broker TOML's\n`[remote_storage.s3]` block. The credentials come from Kubernetes\nSecrets, and the operator injects them as the broker-pod env vars\n`AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`."
                    nullable: true
                    properties:
                      allowHttp:
                        description: "Allow plaintext HTTP. It is off by default. Turn it on for a `MinIO`\nthat runs without TLS. AWS S3 never needs it."
                        type: boolean
                      bucket:
                        description: S3 bucket name. Required.
                        type: string
                      credentials:
                        description: "Optional explicit credentials. When `None`, the broker falls back to\nthe AWS credential chain, such as IRSA on EKS or an instance profile on\nEC2."
                        nullable: true
                        properties:
                          accessKeyId:
                            description: Reference to the Secret holding the `AWS_ACCESS_KEY_ID` value.
                            properties:
                              key:
                                description: Key within the Secret's `data`. Defaults to `secret-key`.
                                nullable: true
                                type: string
                              name:
                                description: Secret name in the same namespace as the `Kafka` CR.
                                type: string
                            required:
                            - name
                            type: object
                          secretAccessKey:
                            description: Reference to the Secret holding the `AWS_SECRET_ACCESS_KEY` value.
                            properties:
                              key:
                                description: Key within the Secret's `data`. Defaults to `secret-key`.
                                nullable: true
                                type: string
                              name:
                                description: Secret name in the same namespace as the `Kafka` CR.
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - accessKeyId
                        - secretAccessKey
                        type: object
                      endpoint:
                        description: "Optional custom endpoint URL, for example `http://minio:9000` for\n`MinIO`, or `https://<account>.r2.cloudflarestorage.com` for Cloudflare\nR2. When `None`, the broker uses the AWS S3 endpoint for the configured\nregion."
                        nullable: true
                        type: string
                      multipartChunkSize:
                        description: "Override the per-part size for multipart uploads in bytes. When unset,\nthe broker uses\n`krabka_remote_storage::DEFAULT_MULTIPART_CHUNK_SIZE`, which is\n16 MiB."
                        format: uint64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      multipartThreshold:
                        description: "Override the single-PUT and multipart cutoff in bytes. When unset, the\nbroker uses `krabka_remote_storage::DEFAULT_MULTIPART_THRESHOLD`, which\nis 100 MiB. Lower it in tests to exercise the multipart path on small\nfixtures."
                        format: uint64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      prefix:
                        description: "Optional key prefix inside the bucket. It lets more than one Krabka\ncluster share a bucket without a collision."
                        nullable: true
                        type: string
                      region:
                        description: "AWS region. It is required even for the non-AWS endpoints `MinIO` and\nR2, because the `AmazonS3Builder` of `object_store` rejects an empty\nregion."
                        type: string
                    required:
                    - bucket
                    - region
                    type: object
                  type:
                    description: Backend kind selector.
                    enum:
                    - Local
                    - S3
                    - Gcs
                    type: string
                required:
                - type
                type: object
              tracing:
                description: "Distributed-tracing wiring for the broker pods. When `Some`, the\noperator renders the matching `KRABKA_OTLP_*` env vars onto every\nbroker pod. The broker's telemetry pipeline reads them with\n`TelemetryConfig::from_env` and installs the OTLP tracer at startup.\nWhen `None`, the operator emits no OTLP env vars, and the broker leaves\ntracing off. That is the default."
                nullable: true
                properties:
                  otlp:
                    description: OTLP-backend tuning. Required when `kind == Otlp`.
                    nullable: true
                    properties:
                      endpoint:
                        description: "Required. OTLP collector endpoint in the form `scheme://host:port`.\nThe operator renders it as `KRABKA_OTLP_ENDPOINT`. A set field also\nsets `KRABKA_OTLP_ENABLED=true`."
                        type: string
                      protocol:
                        description: "OTLP wire protocol selector. It has the same shape as the broker's\ninternal `OtlpProtocol` enum and the `OTEL_EXPORTER_OTLP_PROTOCOL` spec\nvalues."
                        enum:
                        - grpc
                        - http_protobuf
                        nullable: true
                        type: string
                      sampleRatio:
                        description: "Optional sampling ratio in `[0.0, 1.0]`. The operator renders it as\n`KRABKA_OTLP_SAMPLE_RATIO`. An unset field leaves the binary's own\ndefault of `1.0`, which samples every trace."
                        format: double
                        nullable: true
                        type: number
                      serviceName:
                        description: "Optional `service.name` resource attribute. The operator renders it as\n`OTEL_SERVICE_NAME`. An unset field leaves the binary's own name, which\nis `\"krabka-broker\"` for `Kafka` and `\"krabka-gres\"` for `Gres`."
                        nullable: true
                        type: string
                      timeout:
                        description: "Optional export timeout. The operator renders it as\n`KRABKA_OTLP_TIMEOUT`. An unset field leaves the binary's own default\nof `10s`."
                        nullable: true
                        type: string
                    required:
                    - endpoint
                    type: object
                  type:
                    description: Tracing backend selector.
                    enum:
                    - Otlp
                    type: string
                required:
                - type
                type: object
            required:
            - kafkaVersion
            type: object
          status:
            nullable: true
            properties:
              clientsCa:
                description: "Status surface for one CA.\n\nThe reconciler fills it in from the parsed CA cert and the CRD spec."
                nullable: true
                properties:
                  certGeneration:
                    default: 0
                    description: "Monotonic generation of the active signing cert. It increments on\na same-key renewal and on a key promotion."
                    format: uint64
                    minimum: 0.0
                    type: integer
                  generated:
                    description: "`true` when the operator generated this CA, that is, when\n`generateCertificateAuthority == true`. `false` for a BYO CA."
                    type: boolean
                  keyGeneration:
                    default: 0
                    description: "Monotonic generation of the active signing key. It increments only\non a key replacement."
                    format: uint64
                    minimum: 0.0
                    type: integer
                  notAfter:
                    description: "RFC3339 `notAfter` of the current CA cert, which is the signing\ncert."
                    type: string
                  rotationPhase:
                    description: "Staged key-replacement phase. One of `idle`, `key-replace-trust`,\nand `key-replace-promote`."
                    nullable: true
                    type: string
                  trustAnchors:
                    description: Number of CA certs in the trust bundle now.
                    format: uint
                    minimum: 0.0
                    nullable: true
                    type: integer
                required:
                - generated
                - notAfter
                type: object
              clusterCa:
                description: "Status surface for one CA.\n\nThe reconciler fills it in from the parsed CA cert and the CRD spec."
                nullable: true
                properties:
                  certGeneration:
                    default: 0
                    description: "Monotonic generation of the active signing cert. It increments on\na same-key renewal and on a key promotion."
                    format: uint64
                    minimum: 0.0
                    type: integer
                  generated:
                    description: "`true` when the operator generated this CA, that is, when\n`generateCertificateAuthority == true`. `false` for a BYO CA."
                    type: boolean
                  keyGeneration:
                    default: 0
                    description: "Monotonic generation of the active signing key. It increments only\non a key replacement."
                    format: uint64
                    minimum: 0.0
                    type: integer
                  notAfter:
                    description: "RFC3339 `notAfter` of the current CA cert, which is the signing\ncert."
                    type: string
                  rotationPhase:
                    description: "Staged key-replacement phase. One of `idle`, `key-replace-trust`,\nand `key-replace-promote`."
                    nullable: true
                    type: string
                  trustAnchors:
                    description: Number of CA certs in the trust bundle now.
                    format: uint
                    minimum: 0.0
                    nullable: true
                    type: integer
                required:
                - generated
                - notAfter
                type: object
              conditions:
                default: []
                description: "Standard Kubernetes-style condition list. It shows `Ready`,\n`ListenersValid`, and `ListenersReady`."
                items:
                  properties:
                    lastTransitionTime:
                      description: RFC3339 timestamp.
                      type: string
                    message:
                      description: Human-readable message.
                      type: string
                    reason:
                      description: CamelCase machine reason.
                      type: string
                    status:
                      description: "`True`, `False`, or `Unknown`."
                      type: string
                    type:
                      description: For example, `Ready`.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              kafkaVersion:
                description: Echo of `spec.kafkaVersion`, for observability.
                nullable: true
                type: string
              listeners:
                description: "Per-listener resolved addresses. The operator fills them in once\n`ListenersReady=True`."
                items:
                  properties:
                    addresses:
                      default: []
                      items:
                        properties:
                          host:
                            type: string
                          port:
                            format: int32
                            type: integer
                        required:
                        - host
                        - port
                        type: object
                      type: array
                    bootstrapServers:
                      description: "`host:port` that clients put in `bootstrap.servers`."
                      type: string
                    name:
                      type: string
                    type:
                      enum:
                      - internal
                      - nodeport
                      - loadbalancer
                      - ingress
                      - route
                      type: string
                  required:
                  - bootstrapServers
                  - name
                  - type
                  type: object
                type: array
              metadataVersion:
                description: "The operator-finalized metadata version. On an existing cluster it\nadvances only after `UpdateFeatures` accepts the requested level."
                nullable: true
                type: string
              readyReplicas:
                description: The same value as `StatefulSet.status.readyReplicas`.
                format: int32
                nullable: true
                type: integer
              replicas:
                description: The same value as `StatefulSet.status.replicas`.
                format: int32
                nullable: true
                type: integer
              targetMetadataVersion:
                description: "The metadata feature level requested by the current spec. This may be\nnewer than `metadataVersion` while broker pools are rolling."
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Kafka
        type: object
    served: true
    storage: true
    subresources:
      status: {}
