                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              delegationTokenExpiryTimestampMs:
                description: "Current `expiry_timestamp_ms` of the operator-managed delegation\ntoken. Each successful renew extends it. The operator compares it\nagainst `now` to decide when to renew, as\n`spec.authentication.renewBeforeExpiry` specifies."
                format: int64
                nullable: true
                type: integer
              delegationTokenId:
                description: "Persisted `token_id`, a UUID, of the operator-managed delegation\ntoken for this user. The operator uses it across reconciles to find the\nsame token with `DescribeDelegationToken`. It is present once the\noperator has issued a token with `CreateDelegationToken`."
                nullable: true
                type: string
              delegationTokenMaxTimestampMs:
                description: "Token's absolute upper bound, which is `max_timestamp_ms`. A renew can\nnever push `expiry_timestamp_ms` past this bound. The operator stops\nthe renews and surfaces `TokenExpiring` once no more extension is\npossible."
                format: int64
                nullable: true
                type: integer
