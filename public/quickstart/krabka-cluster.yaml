apiVersion: krabka.io/v1alpha1
kind: Kafka
metadata:
  name: m20-quickstart
spec:
  kafkaVersion: "4.0.0"
  metricsConfig: {}
---
apiVersion: krabka.io/v1alpha1
kind: KafkaNodePool
metadata:
  name: brokers
  labels:
    krabka.io/cluster: m20-quickstart
spec:
  roles: [Controller, Broker]
  replicas: 3
  nodeIdStart: 0
  # krabka-broker v1.0.8 (multi-arch release index). krabka-operator 1.0.2
  # passes the --node-id that krabka-format requires from broker 1.0.0.
  image: ghcr.io/krabka-io/krabka-broker@sha256:1d0dd0d4d721e47866eda23279c37aba11324db222ba8cd7f001554c32e7745f
  storage:
    type: PersistentClaim
    size: 1Gi
    deleteClaim: true
---
apiVersion: krabka.io/v1alpha1
kind: KafkaTopic
metadata:
  name: quickstart
  labels:
    krabka.io/cluster: m20-quickstart
spec:
  partitions: 1
  replicas: 1
