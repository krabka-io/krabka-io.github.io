  storage:
    type: PersistentClaim
    size: 1Gi
    deleteClaim: true
---
apiVersion: krabka.io/v1alpha1
kind: KafkaTopic
metadata:
  name: quickstart
  labels:
    krabka.io/cluster: m20-quickstart
spec:
  partitions: 1
  replicas: 1
