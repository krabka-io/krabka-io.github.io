apiVersion: krabka.io/v1alpha1
kind: Kafka
metadata:
  name: m20-quickstart
spec:
  kafkaVersion: "4.0.0"
  metricsConfig: {}
---
apiVersion: krabka.io/v1alpha1
kind: KafkaNodePool
metadata:
  name: brokers
  labels:
    krabka.io/cluster: m20-quickstart
spec:
  roles: [Controller, Broker]
  replicas: 1
  nodeIdStart: 0
  image: ghcr.io/krabka-io/krabka-broker@sha256:d904478424431650314950e390e00107aee089464747208f573206a95c8d0c24
  storage:
    type: PersistentClaim
    size: 1Gi
    deleteClaim: true
---
apiVersion: krabka.io/v1alpha1
kind: KafkaTopic
metadata:
  name: quickstart
  labels:
    krabka.io/cluster: m20-quickstart
spec:
  partitions: 1
  replicas: 1
