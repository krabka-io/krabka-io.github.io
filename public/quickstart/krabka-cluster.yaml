apiVersion: krabka.io/v1alpha1
kind: Kafka
metadata:
  name: m20-quickstart
spec:
  kafkaVersion: "4.0.0"
  metricsConfig: {}
---
apiVersion: krabka.io/v1alpha1
kind: KafkaNodePool
metadata:
