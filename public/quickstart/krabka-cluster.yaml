apiVersion: krabka.io/v1alpha1
kind: Kafka
metadata:
  name: m20-quickstart
spec:
  kafkaVersion: "4.0.0"
  metricsConfig: {}
---
apiVersion: krabka.io/v1alpha1
kind: KafkaNodePool
metadata:
  name: brokers
  labels:
    krabka.io/cluster: m20-quickstart
spec:
  roles: [Controller, Broker]
  replicas: 3
  nodeIdStart: 0
  # krabka-broker v1.0.1 (multi-arch release index). krabka-operator 1.0.1
  # passes the --node-id that krabka-format requires from broker 1.0.0.
  image: ghcr.io/krabka-io/krabka-broker@sha256:d0a383b12176a55eb771c870d819ccb4f60ce0bb6b5356b5ec44285c01d7fd93
  storage:
    type: PersistentClaim
    size: 1Gi
    deleteClaim: true
---
apiVersion: krabka.io/v1alpha1
kind: KafkaTopic
metadata:
  name: quickstart
  labels:
    krabka.io/cluster: m20-quickstart
spec:
  partitions: 1
  replicas: 1
