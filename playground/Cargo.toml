[package]
name = "krabka-playground"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
authors = ["The Krabka Authors"]
publish = false
description = "WebAssembly bindings driving Krabka's deterministic KRaft consensus simulator, the Creusot-verified kernels, and the Cluster Lab's virtual network, Kafka clients and schema registry in the browser"
repository = "https://github.com/krabka-io/krabka-io.github.io"
homepage = "https://krabka-io.github.io"
readme = "README.md"
keywords = ["kafka", "kraft", "raft", "consensus", "wasm"]
categories = ["wasm", "simulation"]

[workspace]
# This crate is the only Rust code in the website repository, so it carries its
# own workspace root. Nothing here is published to crates.io.

[lints.rust]
# NOTE: the krabka workspaces forbid `unsafe_code`. `#[wasm_bindgen]` expands to
# the `unsafe extern "C"` import/export shims every wasm-bindgen crate needs, so
# the forbid would make this crate uncompilable. The Rust written here is safe;
# only the generated glue is unsafe.

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
# The module ships to every visitor of the lab page, so size beats speed. Fat
# LTO and one codegen unit let the linker drop the protocol messages the lab
# never touches.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# ---- Krabka crates. The broker pins are `main`; the protocol pins are one
# revision of the protocol repository.
krabka-kraft-core = { git = "https://github.com/krabka-io/krabka-broker", rev = "d2ee0d14003c7ccc52d792db495120f48e13028e", features = ["sim"] }
# The Creusot-verified decision kernels the `/docs/verified` page evaluates
# interactively. This revision matches the verified-kernels catalog
# (`src/data/verified-kernels.json`), so it moves only with
# `npm run repin-kernels`, not with the other broker pins.
krabka-verified = { git = "https://github.com/krabka-io/krabka-broker", rev = "d2ee0d14003c7ccc52d792db495120f48e13028e" }
krabka-ids = "0.5.0"
krabka-units = "0.5.0"
# The Kafka wire codec every lab client speaks and the real broker's frames are
# read with, with every codec. Upstream `lz4` and `zstd` bind C libraries, so
# `krabka-compression` is patched below to the pure-Rust copy in
# `vendor/krabka-compression`.
krabka-protocol = { version = "0.5.0", default-features = false, features = ["gzip", "snappy", "lz4", "zstd"] }
# The streams application node runs its tasks through `EmbeddedTask`, builds
# its topology with the crate's `Topology`, and joins its group with the
# byte-exact KIP-1071 wire topology the crate derives. `main` with the
# embedder API.
krabka-client-streams = { git = "https://github.com/krabka-io/krabka-streams-rs", rev = "44afe9b6936eddaaef9eff85f22c9f11fa9056b5" }

# ---- Schema engines. The schema registry node parses and checks schemas with
# the same crates `krabka-schema-registry` uses.
apache-avro = "0.22"
jsonschema = { version = "0.58", default-features = false }
protox-parse = "0.9"
prost-reflect = "0.16"
prost = "0.14"

# ---- Plumbing.
base64 = "0.23"
bytes = "1"
derive_more = { version = "2", features = ["display", "from", "into", "constructor", "add", "add_assign"] }
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde", "js"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# SSPI's sans-IO Kerberos contexts and its in-process lab KDC. No native
# credential store, network_client feature, or Windows API is used.
sspi = { git = "https://github.com/robot-head/sspi-rs", rev = "73ad2bcfff41c44b22c7e2400d528faedbf38967", default-features = false }
kdc = { git = "https://github.com/robot-head/sspi-rs", rev = "73ad2bcfff41c44b22c7e2400d528faedbf38967" }
picky-asn1 = "0.10"
picky-krb = "0.13"
sha2 = "0.11"
time = { version = "0.3", features = ["wasm-bindgen"] }

[dev-dependencies]
assert2 = "0.4"

# `krabka-kraft-core` pulls `uuid` (with `v4`), which pulls `getrandom`, and the
# crates behind it need a JavaScript randomness switch on
# `wasm32-unknown-unknown`. The lab draws its own randomness from a seeded
# xorshift, but the symbols must still link, so wire up the browser backends
# for the wasm target only. `.cargo/config.toml` sets the matching
# `getrandom_backend="wasm_js"` cfg.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# The protocol crates are not published to crates.io. The broker workspace
# resolves them the same way: a git pin on the krabka-protocol repository. Keep
# every entry on one revision.
[patch.crates-io]
# `krabka-client-streams` links the Kafka network clients and the schema serdes
# in a native build (the host tests), never on wasm. They come from their
# repositories too, at revisions built against the protocol revision above.
krabka-admin-ui = { git = "https://github.com/krabka-io/krabka-cli", rev = "91d4b370a3cf7e54808c1b0aa70d11fdd21bf45c" }
