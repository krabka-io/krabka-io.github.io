# `krabka-protocol` names `krabka-compression` by path inside its repository,
# so the git source is patched too: every copy in the graph is the vendored
# one, with pure-Rust lz4 (`lz4rip`) and zstd (`ruzstd`) that build for
# wasm32-unknown-unknown.
[patch."https://github.com/krabka-io/krabka-protocol"]
krabka-compression = { path = "vendor/krabka-compression" }
