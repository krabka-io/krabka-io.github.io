[package]
name = "krabka-playground"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["The Krabka Authors"]
publish = false
description = "WebAssembly bindings driving Krabka's deterministic KRaft consensus simulator, the Creusot-verified kernels, and the Cluster Lab distributed-system simulator in the browser"
repository = "https://github.com/krabka-io/krabka-io.github.io"
homepage = "https://krabka-io.github.io"
readme = "README.md"
keywords = ["kafka", "kraft", "raft", "consensus", "wasm"]
categories = ["wasm", "simulation"]

[workspace]
# This crate is the only Rust code in the website repository, so it carries its
# own workspace root. Nothing here is published to crates.io.

[lints.rust]
# NOTE: the krabka workspaces forbid `unsafe_code`. `#[wasm_bindgen]` expands to
# the `unsafe extern "C"` import/export shims every wasm-bindgen crate needs, so
# the forbid would make this crate uncompilable. The Rust written here is safe;
# only the generated glue is unsafe.

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
# The module ships to every visitor of the lab page, so size beats speed. Fat
# LTO and one codegen unit let the linker drop the protocol messages the lab
# never touches.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# ---- Krabka crates. The broker pins are `main`; the protocol pins are the
# revision that keeps GSSAPI native-only so `krabka-metadata` builds for wasm.
krabka-kraft-core = { git = "https://github.com/krabka-io/krabka-broker", rev = "53e0ad76cf9afa15b557454bd882b627e7e16bc6", features = ["sim"] }
# The Creusot-verified decision kernels the `/docs/verified` page evaluates
# interactively. Same revision as the consensus core, so the two never disagree.
krabka-verified = { git = "https://github.com/krabka-io/krabka-broker", rev = "53e0ad76cf9afa15b557454bd882b627e7e16bc6" }
krabka-ids = "0.4.0"
krabka-units = "0.4.0"
krabka-voters = "0.4.0"
# The Kafka wire codec every simulated broker and client speaks. Only the
# pure-Rust compression codecs: `lz4` and `zstd` bind C libraries.
krabka-protocol = { version = "0.4.0", default-features = false, features = ["gzip", "snappy"] }
krabka-metadata = "0.4.0"

# ---- Schema engines. The schema registry node parses and checks schemas with
# the same crates `krabka-schema-registry` uses.
apache-avro = "0.21"
jsonschema = { version = "0.57", default-features = false }
protox-parse = "0.9"
prost-reflect = "0.16"
prost = "0.14"

# ---- Plumbing.
base64 = "0.22"
bytes = "1"
derive_more = { version = "2", features = ["display", "from", "into", "constructor", "add", "add_assign"] }
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde", "js"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# Already in the graph through `krabka-metadata`; the broker names the listener protocol of its registration with it.
krabka-security = "0.4.0"

[dev-dependencies]
assert2 = "0.4"

# `krabka-kraft-core` pulls `uuid` (with `v4`), which pulls `getrandom`, and
# `ring` (through `krabka-security`) needs its own JavaScript randomness switch
# on `wasm32-unknown-unknown`. The lab draws its own randomness from a seeded
# xorshift, but the symbols must still link, so wire up the browser backends
# for the wasm target only. `.cargo/config.toml` sets the matching
# `getrandom_backend="wasm_js"` cfg.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1", features = ["web"] }

# The protocol crates are not published to crates.io. The broker workspace
# resolves them the same way: a git pin on the krabka-protocol repository. Keep
# every entry on one revision.
[patch.crates-io]
krabka-compression = { git = "https://github.com/krabka-io/krabka-protocol", rev = "6133ca4d24a477bd9fce7a25853125eb5dcfcb30" }
krabka-ids = { git = "https://github.com/krabka-io/krabka-protocol", rev = "6133ca4d24a477bd9fce7a25853125eb5dcfcb30" }
krabka-metadata = { git = "https://github.com/krabka-io/krabka-protocol", rev = "6133ca4d24a477bd9fce7a25853125eb5dcfcb30" }
krabka-protocol = { git = "https://github.com/krabka-io/krabka-protocol", rev = "6133ca4d24a477bd9fce7a25853125eb5dcfcb30" }
krabka-security = { git = "https://github.com/krabka-io/krabka-protocol", rev = "6133ca4d24a477bd9fce7a25853125eb5dcfcb30" }
krabka-units = { git = "https://github.com/krabka-io/krabka-protocol", rev = "6133ca4d24a477bd9fce7a25853125eb5dcfcb30" }
krabka-voters = { git = "https://github.com/krabka-io/krabka-protocol", rev = "6133ca4d24a477bd9fce7a25853125eb5dcfcb30" }
