# `getrandom` 0.3 and later refuse `wasm32-unknown-unknown` unless the build
# names the JavaScript backend. The `wasm_js` cargo feature in Cargo.toml turns
# the backend on; this cfg is the second half of the switch.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
