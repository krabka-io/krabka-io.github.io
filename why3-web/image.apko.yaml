# Base of the builder that compiles Why3 and Alt-Ergo to JavaScript.
#
# Wolfi supplies the OCaml 5.3 compiler, opam and dune; opam then builds the
# pinned OCaml libraries (js_of_ocaml, Why3's and Alt-Ergo's dependencies) from
# source inside the container. Node runs the Creusot prelude generator port.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - apk-tools
    - autoconf
    - bash
    - build-base
    - busybox
    - bzip2
    - ca-certificates-bundle
    - curl
    - git
    - gmp-dev
    - m4
    - nodejs
    - ocaml
    - ocaml-findlib
    - opam
    - pkgconf
    - rsync
    - wolfi-baselayout
    - zlib-dev

environment:
  HOME: /root
  PATH: /root/.opam/default/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin

archs:
  - amd64
