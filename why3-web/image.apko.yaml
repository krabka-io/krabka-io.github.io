# Base of the builder that compiles Why3 and Alt-Ergo to JavaScript.
#
# Wolfi supplies opam and the C toolchain; opam then builds the pinned OCaml
# compiler (pins.env) and the OCaml libraries (js_of_ocaml, Why3's and
# Alt-Ergo's dependencies) from source inside the container. Wolfi's own
# `ocaml` package is deliberately absent: it tracks the newest OCaml, which
# js_of_ocaml 6.2.0 does not support. Node runs the Creusot prelude generator.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - apk-tools
    - autoconf
    - bash
    - build-base
    - busybox
    - bzip2
    - ca-certificates-bundle
    - cmake
    - curl
    - git
    - gmp-dev
    - m4
    - nodejs
    - opam
    - openjdk-21-jre
    - pkgconf
    - python3
    - rsync
    - wolfi-baselayout
    - xz
    - zlib-dev

environment:
  HOME: /root
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  PATH: /root/.opam/default/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin

archs:
  - amd64
