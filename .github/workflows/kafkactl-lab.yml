name: Release kafkactl lab bridge

on:
  push:
    tags: ['kafkactl-lab-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
          - os: macos-15-intel
            platform: darwin-amd64
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: kafkactl-lab/go.mod
          cache-dependency-path: kafkactl-lab/go.sum
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          cd kafkactl-lab
          go test ./...
          mkdir -p ../release/package
          if [[ "$RUNNER_OS" == Windows ]]; then
            go build -o ../release/package/kafkactl.exe .
          else
            go build -o ../release/package/kafkactl .
          fi
          cp LICENSE.fgrosse-kafkactl ../release/package/
          cd ../release
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "kafkactl-lab-${{ matrix.platform }}.zip" ./package/*
          else
            tar -czf "kafkactl-lab-${{ matrix.platform }}.tar.gz" -C package .
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}
          path: release/kafkactl-lab-*

  release:
    if: startsWith(github.ref, 'refs/tags/kafkactl-lab-v')
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*'
          merge-multiple: true
          path: release
      - name: Publish the standalone binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum kafkactl-lab-* > checksums.txt
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --generate-notes
