name: Rebuild Helm chart index

# The aggregated Helm chart repository is served from this site at
# https://krabka.io/charts. Charts live in the component repositories. This job
# discovers them, packages and signs them, and opens a pull request with the
# repacked charts and the index, because the main ruleset takes changes only
# through a pull request that passed deploy.yml's `build` check. A maintainer
# merges it, and that push to main deploys the site.
#
# A component repository can request a rebuild right after it releases a chart:
#
#   gh api repos/krabka-io/krabka-io.github.io/dispatches \
#     -f event_type=charts-changed

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [charts-changed]
  push:
    branches: [main]
    paths:
      - 'scripts/build-helm-index.sh'
      - '.github/workflows/helm-index.yml'

permissions:
  # To push the index branch.
  contents: write
  # To open the index pull request.
  pull-requests: write
  # To start deploy.yml's `build` check on the index branch. See the last step.
  actions: write

concurrency:
  group: helm-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Rebuild the aggregated chart index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Helm-native PGP provenance. The public half of this key
          # lives in krabka-io/tooling, under charts/. When the secret is
          # absent the job packages the charts without a .prov file.
          HELM_GPG_KEY: ${{ secrets.HELM_GPG_KEY }}
          HELM_GPG_KEY_ID: ${{ secrets.HELM_GPG_KEY_ID }}
          HELM_GPG_PASSPHRASE: ${{ secrets.HELM_GPG_PASSPHRASE }}
        run: bash scripts/build-helm-index.sh

      - name: Open a pull request with the index when it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: helm-index/rebuild
        run: |
          set -euo pipefail
          # `generated` and `created` carry a fresh timestamp on every run, so
          # compare the chart digests instead. An unchanged set of digests means
          # no chart moved and the pull request is noise.
          if git diff --quiet -- public/charts; then
            echo "No chart changes."
            exit 0
          fi
          digests_changed=$(
            git diff -U0 -- public/charts/index.yaml |
              grep -cE '^[-+][[:space:]]*(digest|name|version|urls):' || true
          )
          if [[ "${digests_changed}" -eq 0 ]] && git diff --quiet -- public/charts/*.tgz; then
            echo "Only timestamps changed. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add public/charts
          # The blank line and the trailers stay inside the YAML block, so they
          # keep the block's indentation. YAML strips it back off again.
          git commit -F - <<'MSG'
          chore: rebuild the aggregated Helm chart index

          Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01Xj9Yz7B2gp85n9KvAJ5npu
          MSG
          # The branch belongs to this job alone, and one open pull request
          # tracks it. A later run replaces an unmerged index with its own, so
          # the pull request always carries the newest one.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          if [[ -z "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')" ]]; then
            gh pr create --base main --head "${BRANCH}" \
              --title "chore: rebuild the aggregated Helm chart index" \
              --body "Opened by the \`helm-index\` workflow in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Merge it to publish the charts."
          fi

          # The ruleset requires deploy.yml's `build` check on the pull
          # request's head, but a push or a pull request made with GITHUB_TOKEN
          # starts no workflow. A workflow_dispatch event is exempt from that
          # rule, and its `build` check lands on the same commit, so run
          # deploy.yml on the branch. deploy.yml deploys only from main.
          gh workflow run deploy.yml --ref "${BRANCH}"
