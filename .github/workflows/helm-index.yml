name: Prepare signed ecosystem release charts
on:
  workflow_dispatch:
    inputs:
      operator_revision:
        description: Verified operator 1.0.2 source commit
        required: true
        type: string
      rebalancer_revision:
        description: Verified rebalancer 0.4.5 source commit
        required: true
        default: b216bb18a763f3b8647efa82ffb4e845e8d44552
        type: string
      registry_revision:
        description: Frozen schema registry source commit
        required: true
        default: 7e5115f74eaba368acf086b2d127230422db8fd6
        type: string
permissions:
  contents: read
concurrency:
  group: signed-ecosystem-release-charts
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Package signed charts from frozen sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELM_GPG_KEY: ${{ secrets.HELM_GPG_KEY }}
          HELM_GPG_KEY_ID: ${{ secrets.HELM_GPG_KEY_ID }}
          HELM_GPG_PASSPHRASE: ${{ secrets.HELM_GPG_PASSPHRASE }}
          OPERATOR_REVISION: ${{ inputs.operator_revision }}
          REBALANCER_REVISION: ${{ inputs.rebalancer_revision }}
          REGISTRY_REVISION: ${{ inputs.registry_revision }}
        run: |
          : "${HELM_GPG_KEY:?Release chart signing key is required}"
          bash scripts/build-helm-index.sh
      - uses: actions/upload-artifact@v4
        with:
          name: signed-ecosystem-charts-${{ github.run_id }}
          path: public/charts/
          if-no-files-found: error
