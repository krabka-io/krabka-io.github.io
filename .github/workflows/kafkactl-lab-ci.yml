name: kafkactl bridge CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bridge: ${{ steps.changes.outputs.bridge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Select bridge checks
        id: changes
        run: node scripts/bridge-ci.mjs

  test-build:
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        working-directory: kafkactl-lab
        shell: bash
    steps:
      - name: Keep temporary files on the runner disk
        working-directory: .
        run: echo "TMPDIR=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: kafkactl-lab/go.mod
          cache-dependency-path: kafkactl-lab/go.sum
      - name: Test bridge
        run: go test -mod=readonly -count=1 -v ./...
      - name: Build supported targets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge-builds"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -mod=readonly -o "$RUNNER_TEMP/bridge-builds/${target/\//-}" .
          done

  gate:
    name: kafkactl bridge gate
    if: always()
    needs: [changes, test-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected bridge checks
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          BRIDGE_SELECTED: ${{ needs.changes.outputs.bridge }}
          BUILD_RESULT: ${{ needs.test-build.result }}
        run: |
          if [[ "$SELECTION_RESULT" != success ]]; then
            echo 'Bridge selection did not succeed.'
            exit 1
          fi
          case "$BRIDGE_SELECTED:$BUILD_RESULT" in
            true:success) echo 'Bridge tests and all five builds passed.' ;;
            false:skipped) echo 'Bridge checks not required (draft or unrelated changes).' ;;
            *) echo "Bridge checks did not pass: $BRIDGE_SELECTED:$BUILD_RESULT"; exit 1 ;;
          esac
