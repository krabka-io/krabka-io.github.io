name: OpenMessaging broker benchmarks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full upstream workloads or a short wiring check'
        type: choice
        options: [full, smoke, dry-run]
        default: full
      workloads:
        description: 'all, or comma-separated names from benchmarks/README.md'
        type: string
        default: all
      replication_factors:
        description: 'Replication factors'
        type: choice
        options: ['1,3', '1', '3']
        default: '1,3'
      repetitions:
        description: 'Rounds per invocation (smoke always uses one)'
        type: choice
        options: ['1', '2', '3']
        default: '1'
      runner:
        description: 'Cyclenerd Google Cloud runner template'
        type: choice
        options: [gcp-ubuntu-24-04-16core, gcp-ubuntu-24-04-32core]
        default: gcp-ubuntu-24-04-16core
      krabka_image:
        description: 'Published Krabka image or digest'
        type: string
        default: ghcr.io/krabka-io/krabka-broker:v0.7.0
      krabka_comparison_image:
        description: 'Optional control image: run control/candidate/candidate/control on one worker'
        type: string
      redpanda_image:
        description: 'Published Redpanda image or digest'
        type: string
        default: docker.redpanda.com/redpandadata/redpanda:v26.2.2

permissions:
  contents: read

concurrency:
  group: openmessaging-benchmarks
  cancel-in-progress: false

jobs:
  plan:
    # One shard per workload and replication factor. All three brokers for a
    # shard, and every round of them, run on the same runner, so each
    # comparison stays on one machine. Shards are spread over a fixed number of
    # lanes; each lane is one runner VM that runs its shards one after another.
    #
    # Cyclenerd creates a VM for each workflow_job.queued event and does not
    # retry one it could not create. Run 37871941914 queued one job per shard,
    # got four 16-core VMs (likely the project's vCPU quota), and its other 22
    # shards never got a runner. max-parallel does not help, because GitHub can
    # send every matrix job's queued event at once. So the matrix has only as
    # many jobs as VMs fit: four 16-core lanes (64 vCPUs) or two 32-core lanes.
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Plan shards
        id: plan
        env:
          BENCHMARK_WORKLOADS: ${{ inputs.workloads }}
          BENCHMARK_RF: ${{ inputs.replication_factors }}
          BENCHMARK_LANES: ${{ inputs.runner == 'gcp-ubuntu-24-04-32core' && '2' || '4' }}
        run: |
          lanes=$(node scripts/benchmark-openmessaging-shards.mjs plan --lanes "$BENCHMARK_LANES" \
            --workloads "$BENCHMARK_WORKLOADS" --replication-factors "$BENCHMARK_RF")
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"
          echo "$lanes"

  benchmark:
    needs: plan
    name: benchmark (${{ matrix.lane.name }})
    # Cyclenerd provisions an ephemeral VM from this label when each job queues.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 2880
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Check measurement and failure handling
        run: npm run test:benchmark
      - name: Authenticate private Google Cloud image pulls
        if: startsWith(inputs.krabka_image, 'us-central1-docker.pkg.dev/') || startsWith(inputs.krabka_comparison_image, 'us-central1-docker.pkg.dev/')
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Run this lane's shards against all three brokers
        env:
          BENCHMARK_MODE: ${{ inputs.mode }}
          LANE_SHARDS: ${{ matrix.lane.shards }}
          LANE_WORKLOADS: ${{ matrix.lane.workloads }}
          LANE_RFS: ${{ matrix.lane.rfs }}
          BENCHMARK_REPETITIONS: ${{ inputs.repetitions }}
          KRABKA_IMAGE: ${{ inputs.krabka_image }}
          KRABKA_COMPARISON_IMAGE: ${{ inputs.krabka_comparison_image }}
          REDPANDA_IMAGE: ${{ inputs.redpanda_image }}
        run: |
          read -r -a shards <<< "$LANE_SHARDS"
          read -r -a workloads <<< "$LANE_WORKLOADS"
          read -r -a rfs <<< "$LANE_RFS"
          case "$BENCHMARK_MODE" in
            smoke) mode=(--smoke) ;;
            dry-run) mode=(--dry-run) ;;
            full) mode=() ;;
            *) exit 1 ;;
          esac
          images=("$KRABKA_IMAGE")
          if test -n "$KRABKA_COMPARISON_IMAGE"; then
            images=("$KRABKA_COMPARISON_IMAGE" "$KRABKA_IMAGE" "$KRABKA_IMAGE" "$KRABKA_COMPARISON_IMAGE")
          fi
          # A failed shard does not stop the lane; the job fails at the end
          # and the merge refuses the incomplete set.
          failed=()
          for i in "${!shards[@]}"; do
            echo "::group::Shard ${shards[$i]}"
            for image in "${images[@]}"; do
              if ! node scripts/benchmark.mjs --suite openmessaging --workloads "${workloads[$i]}" \
                  --replication-factors "${rfs[$i]}" --repetitions "$BENCHMARK_REPETITIONS" \
                  --redpanda-image "$REDPANDA_IMAGE" "${mode[@]}" --krabka-image "$image"; then
                failed+=("${shards[$i]}")
                break
              fi
            done
            echo "::endgroup::"
          done
          if test "${#failed[@]}" -gt 0; then
            echo "::error::Failed shards: ${failed[*]}"
            exit 1
          fi
      - name: Add report to job summary
        if: always()
        run: |
          for report in .benchmarks/*/summary.md; do
            if test -f "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Retain results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openmessaging-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane.name }}
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
          path: |
            .benchmarks/*/provenance.json
            .benchmarks/*/summary.md
            .benchmarks/*/collection.json
            .benchmarks/*/commands.jsonl
            .benchmarks/*/*.container-state.json
            .benchmarks/*/*.stdout
            .benchmarks/*/*.stderr
            .benchmarks/*/*.yaml
            .benchmarks/*/rf*/*.json
            .benchmarks/*/rf*/*.jsonl
            .benchmarks/*/rf*/*.yaml
            .benchmarks/*/rf*/*.stdout
            .benchmarks/*/rf*/*.stderr

  merge:
    # Assemble the shards into one run in the single-runner layout, so
    # scripts/publish-openmessaging.mjs can publish it. Fails unless every
    # workload x RF x broker x round is present exactly once. A control/candidate
    # comparison keeps its four separate reports per shard and is not merged.
    needs: [plan, benchmark]
    if: ${{ !cancelled() && inputs.mode != 'dry-run' && inputs.krabka_comparison_image == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download shard results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: openmessaging-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: shards
      - name: Merge shards
        env:
          RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p .benchmarks
          node scripts/benchmark-openmessaging-shards.mjs merge --out ".benchmarks/$RUN_ID" shards/*/*/
          cat ".benchmarks/$RUN_ID/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain merged results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openmessaging-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
          path: |
            .benchmarks/*/provenance.json
            .benchmarks/*/summary.md
            .benchmarks/*/rf*/*.json
            .benchmarks/*/rf*/*.jsonl
            .benchmarks/*/rf*/*.yaml
            .benchmarks/*/rf*/*.stdout
            .benchmarks/*/rf*/*.stderr
