name: OpenMessaging broker benchmarks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full upstream workloads or a short wiring check'
        type: choice
        options: [full, smoke, dry-run]
        default: full
      workloads:
        description: 'all, or comma-separated names from benchmarks/README.md'
        type: string
        default: all
      replication_factors:
        description: 'Replication factors'
        type: choice
        options: ['1,3', '1', '3']
        default: '1,3'
      repetitions:
        description: 'Independent rounds (smoke always uses one)'
        type: choice
        options: ['1', '2', '3']
        default: '1'
      runner:
        description: 'Cyclenerd Google Cloud runner template'
        type: choice
        options: [gcp-ubuntu-24-04-16core, gcp-ubuntu-24-04-32core]
        default: gcp-ubuntu-24-04-16core
      krabka_image:
        description: 'Published Krabka image or digest'
        type: string
        default: ghcr.io/krabka-io/krabka-broker:v0.7.0
      redpanda_image:
        description: 'Published Redpanda image or digest'
        type: string
        default: docker.redpanda.com/redpandadata/redpanda:v26.2.2

permissions:
  contents: read

concurrency:
  group: openmessaging-benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    # Cyclenerd provisions an ephemeral VM from this label when the job queues.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Check measurement and failure handling
        run: npm run test:benchmark
      - name: Run OpenMessaging against all three brokers
        env:
          BENCHMARK_MODE: ${{ inputs.mode }}
          BENCHMARK_WORKLOADS: ${{ inputs.workloads }}
          BENCHMARK_RF: ${{ inputs.replication_factors }}
          BENCHMARK_REPETITIONS: ${{ inputs.repetitions }}
          KRABKA_IMAGE: ${{ inputs.krabka_image }}
          REDPANDA_IMAGE: ${{ inputs.redpanda_image }}
        run: |
          args=(--suite openmessaging --workloads "$BENCHMARK_WORKLOADS"
                --replication-factors "$BENCHMARK_RF" --repetitions "$BENCHMARK_REPETITIONS"
                --krabka-image "$KRABKA_IMAGE" --redpanda-image "$REDPANDA_IMAGE")
          case "$BENCHMARK_MODE" in
            smoke) args+=(--smoke) ;;
            dry-run) args+=(--dry-run) ;;
            full) ;;
            *) exit 1 ;;
          esac
          node scripts/benchmark.mjs "${args[@]}"
      - name: Add report to job summary
        if: always()
        run: |
          for report in .benchmarks/*/summary.md; do
            if test -f "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Retain results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openmessaging-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
          path: |
            .benchmarks/*/provenance.json
            .benchmarks/*/summary.md
            .benchmarks/*/collection.json
            .benchmarks/*/commands.jsonl
            .benchmarks/*/*.stdout
            .benchmarks/*/*.stderr
            .benchmarks/*/*.yaml
            .benchmarks/*/rf*/*.json
            .benchmarks/*/rf*/*.jsonl
            .benchmarks/*/rf*/*.yaml
            .benchmarks/*/rf*/*.stdout
            .benchmarks/*/rf*/*.stderr
