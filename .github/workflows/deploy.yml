name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check website validation and sync guards
        run: npm run test:website

      # Two Rust crates compile to WebAssembly here. The consensus playground
      # and the Cluster Lab (/docs/playground, /docs/lab) are `playground/`,
      # built for wasm32-unknown-unknown by `npm run build`, which runs
      # playground/build.sh; that script downloads the matching wasm-bindgen
      # CLI itself. The real krabka-broker the lab runs in a Web Worker is
      # `playground/broker-wasi/`, built for wasm32-wasip1 by
      # `npm run build:broker`.
      - name: Setup Rust with the wasm32 targets
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown, wasm32-wasip1

      # Pull requests read the cache that main writes and save none of their
      # own: the broker's dependency graph is large, and a copy per pull
      # request would crowd main's out of the repository's cache quota.
      - name: Cache the Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            playground
            playground/broker-wasi
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The C code in the broker's graph (ring, zstd and LZ4) compiles with
      # the runner's clang against the WASI sysroot that wasi-sdk publishes,
      # as in the krabka-broker and krabka-client-rs wasm jobs.
      - name: Install the WASI sysroot
        env:
          WASI_SYSROOT_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sysroot-25.0.tar.gz
        run: |
          set -euo pipefail
          curl -LsSf --retry 5 --retry-all-errors \
            --output "${RUNNER_TEMP}/wasi-sysroot.tar.gz" "${WASI_SYSROOT_URL}"
          tar -xzf "${RUNNER_TEMP}/wasi-sysroot.tar.gz" -C "${RUNNER_TEMP}"
          sysroot="${RUNNER_TEMP}/wasi-sysroot-25.0"
          test -d "${sysroot}/include"
          {
            echo "CC_wasm32_wasip1=clang"
            echo "CFLAGS_wasm32_wasip1=--sysroot=${sysroot}"
          } >> "${GITHUB_ENV}"

      # `clang -print-prog-name` gives the path of the archiver that clang
      # finds for itself, or only the bare name when it finds none. For a bare
      # name, take the `llvm-ar` of the newest LLVM on the runner, which has
      # no unversioned one on PATH.
      - name: Find the LLVM archiver
        run: |
          set -euo pipefail
          command -v clang
          ar="$(clang -print-prog-name=llvm-ar)"
          if ! command -v "${ar}" >/dev/null 2>&1; then
            ar="$(ls /usr/lib/llvm-*/bin/llvm-ar | sort -V | tail -n 1)"
          fi
          "${ar}" --version
          echo "AR_wasm32_wasip1=${ar}" >> "${GITHUB_ENV}"

      # Before the site build, so that Astro copies the module from public/
      # into dist/ and the published lab serves it. On a pull request this is
      # the check that the broker still builds for the lab.
      - name: Build the real broker for the Cluster Lab
        run: npm run build:broker

      # The proof explorer's browser re-check needs Why3 and Alt-Ergo compiled
      # to JavaScript and the pinned Z3/cvc5 WASM releases. Bazel builds that bundle inside a Docker container
      # (see why3-web/) and the compile takes about nine minutes: the
      # //why3-web:bundle genrule is unsandboxed and local, so Bazel's disk
      # cache never answers for it and it reruns opam and js_of_ocaml on every
      # build. So this caches the unpacked bundle itself, keyed on everything
      # that goes into it, and runs the build only on a miss. Pull requests
      # read the copy that main saved; the README is not an input.
      - name: Cache the Why3 web bundle
        id: why3-web
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: public/why3-web
          key: why3-web-bundle-v1-${{ hashFiles('why3-web/**', '!why3-web/README.md', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', '.bazelrc') }}

      - name: Build the Why3 web bundle
        if: steps.why3-web.outputs.cache-hit != 'true'
        run: npm run build:why3-web

      - name: Check the Why3 web bundle is in place
        run: test -s public/why3-web/manifest.json

      - name: Check the proof workers
        run: npm run check-proof-workers

      - name: Build static website
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cloudflare Web Analytics site token. It is public (it ships in every
          # page), so it is a repository variable; unset, no beacon is added.
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

      - name: Check built links, SEO and page budgets
        run: |
          npm run check-links
          npm run check-seo
          npm run check-page-budgets

      - name: Check browser proof replay with Z3 and cvc5
        run: |
          npx playwright install --with-deps chromium
          npm run check-site
          npm run check-component-docs
          npm run check-proof-smt

      - name: Save website browser checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-checks
          path: artifacts/site-check
          retention-days: 14

      # The verification pages render the broker's synced docs/verification.md
      # as expandable rows. This fails when the catalog's layout has drifted so
      # far that rows or model notes would silently disappear from the site.
      - name: Check the verification catalog still parses
        run: npm run check-catalog

      # Unit checks of the proof explorer's Why3 highlighter and the readable
      # obligation summaries. They need no build output.
      - name: Check the proof explorer's highlighter and summaries
        run: npm run check-proof-highlight && npm run check-proof-readability

      # Unit checks of the Cluster Lab's analyzers on recorded frames and log
      # files: codecs, the Kafka decoder, pairing, pcapng, disk checks.
      - name: Check the Cluster Lab's network and storage analyzers
        run: npm run check-lab-analyzer

      # The invariant checker, the chart sampler and the record tracer, on
      # synthetic snapshots and the same recorded frames.
      - name: Check the Cluster Lab's invariants, charts and record trace
        run: npm run check-lab-observe

      # The presets' scripted experiments (timed faults and checks) on real
      # brokers in headless Chromium: the build above staged the broker module.
      - name: Check the Cluster Lab's preset experiments on real brokers
        run: npm run check-lab-experiments

      - name: Check browser SSPI encryption on real brokers
        run: npm run check-lab-clusters -- --preset=sspi-encrypted
      - name: Check rebalancing and share consumers on real brokers
        run: |
          npm run check-lab-clusters -- --preset=rebalancer --repeat=2
          npm run check-lab-clusters -- --preset=share-group --repeat=2
          npm run check-lab-clusters -- --preset=share-redelivery --repeat=2
      - name: Check broker ACL identities and allow/deny examples
        run: |
          npm run check-lab-acls
          npm run check-lab-clusters -- --preset=broker-acls
          npm run check-lab-clusters -- --preset=broker-acls-deny

      - name: Save Cluster Lab browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab-cluster-failures
          path: artifacts/lab-clusters
          if-no-files-found: ignore
          retention-days: 14

      # Only main deploys. A pull request, or helm-index.yml's dispatch on its
      # branch, runs `build` alone, as the ruleset's required check.
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  production-smoke:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check published pages, essential assets and component APIs
        run: |
          node scripts/check-production.mjs
          node scripts/check-api-links.mjs
