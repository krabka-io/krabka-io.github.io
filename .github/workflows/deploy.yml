name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The consensus playground on /docs/playground is a Rust crate compiled to
      # WebAssembly. `npm run build` runs playground/build.sh, which needs cargo
      # and the wasm32 target. The script downloads the matching wasm-bindgen
      # CLI itself.
      - name: Setup Rust with the wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache the playground build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: playground

      - name: Build static website
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The verification pages render the broker's synced docs/verification.md
      # as expandable rows. This fails when the catalog's layout has drifted so
      # far that rows or model notes would silently disappear from the site.
      - name: Check the verification catalog still parses
        run: npm run check-catalog

      # Only main deploys. A pull request, or helm-index.yml's dispatch on its
      # branch, runs `build` alone, as the ruleset's required check.
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
